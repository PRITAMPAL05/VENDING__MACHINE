<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Vending Machine</title>

    <link rel="stylesheet" href="vending_Mchine.css">
</head>
<body>
<header>
    <h1>🥤 Smart Vending Machine</h1>
    <button id="themeBtn">🌙 Theme</button>
</header>
<div class="container">
    <section class="products-section">
        <h2>Products</h2>
        <input
            type="text"
            id="searchBox"
            placeholder="Search Product..."
        >
        <div id="productGrid" class="product-grid"></div>
    </section>
    <aside class="control-section">
        <div class="panel selection-panel">
            <h2>Select Product</h2>
            <div class="select-info">
                Click on a number to select a product
            </div>
            <div
                id="selectionMatrix"
                class="matrix">
            </div>
        </div>
        <div class="panel cart-panel">
            <h2>Selected Products</h2>
            <div class="cart-table">
                <div class="cart-header">
                    <span>Product Name</span>
                    <span>Price</span>
                    <span>Qty</span>
                    <span>Amount</span>
                    <span></span>
                </div>
                <div id="cartItems">
                    <p class="empty-cart">
                        No products selected.
                    </p>
                </div>
            </div>
            <div class="total-box">
                <strong>Total Amount:</strong>
                <strong>
                    ₹<span id="totalAmount">0</span>
                </strong>
            </div>
            <div class="cart-buttons">
                <button id="resetBtn" class="clear-btn">
                    🗑️ CLEAR CART
                </button>
                <button id="purchaseBtn" class="buy-btn">
                    🛒 BUY NOW
                </button>
                <button id="payNowBtn" class="pay-btn">
                    💳 PAY NOW
                </button>
            </div>
            <div class="cart-message">
                🛒 Click on any number from the matrix
                to add the product to your cart.
            </div>
        </div>
        <div class="panel">
            <h2>Admin Panel</h2>
            <button
                id="restockBtn"
                class="admin-btn restock">
                Restock Products
            </button>
            <button
                id="clearStorageBtn"
                class="admin-btn clear-storage">
                Clear Storage
            </button>
        </div>
        <div class="panel">
            <h2>Inventory Dashboard</h2>
            <div id="inventoryDashboard"></div>
        </div>
    </aside>
</div>
<script src="Vending_Mchine.js"></script>
</body>
</html>
